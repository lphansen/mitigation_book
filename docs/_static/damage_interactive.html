<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Range of damage functions</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; overflow: hidden; }
  #plot { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="plot"></div>
<script>
// Damage parameters and log damage function as in python/frequency_plot.py
// (compute_log_damage_ensemble), which draws Figure 2 of the paper.
const LAMBDA_1 = 0.00017675;
const LAMBDA_2 = 2 * 0.0022;
const Y_UPPER = 2.5;
const N_DAMAGE_MODELS = 20;
const LAMBDA_3 = Array.from({ length: N_DAMAGE_MODELS }, (_, i) => (1 / 3) * i / (N_DAMAGE_MODELS - 1));
const TEMPERATURE = Array.from({ length: 701 }, (_, i) => 3.5 * i / 700);

// The two fixed cases of Figure 2, and the slider values for the third case.
const FIXED_CASES = [{ yhat: 1.75, color: "rgb(255, 0, 0)" }, { yhat: 2.25, color: "rgb(0, 0, 255)" }];
const SLIDER_COLOR = "rgb(0, 138, 62)";
const YHAT_VALUES = Array.from({ length: 19 }, (_, i) => Math.round((1.55 + 0.05 * i) * 100) / 100);
const state = { yhatIndex: YHAT_VALUES.indexOf(2.0), lambda3Index: 9 };

function logDamage(y, yhat, lambda3) {
  if (y < yhat) {
    return LAMBDA_1 * y + LAMBDA_2 / 2 * y * y;
  }
  const d = y - yhat;
  return LAMBDA_1 * y + LAMBDA_2 * Y_UPPER * d + (LAMBDA_2 + lambda3) / 2 * d * d + LAMBDA_2 / 2 * yhat * yhat;
}

// Range (min, max) and average of exp(-n) across the 20 lambda_3 values.
function envelope(yhat) {
  const low = [], high = [], mean = [];
  for (const y of TEMPERATURE) {
    let lo = Infinity, hi = -Infinity, sum = 0;
    for (const lambda3 of LAMBDA_3) {
      const v = Math.exp(-logDamage(y, yhat, lambda3));
      lo = Math.min(lo, v);
      hi = Math.max(hi, v);
      sum += v;
    }
    low.push(lo);
    high.push(hi);
    mean.push(sum / LAMBDA_3.length);
  }
  return { low, high, mean };
}

function rangeAndAverage(yhat, color) {
  const env = envelope(yhat);
  const name = "ŷ = " + yhat.toFixed(2);
  return [
    { x: TEMPERATURE, y: env.low, mode: "lines", line: { width: 0, color: color }, hoverinfo: "skip", showlegend: false },
    { x: TEMPERATURE, y: env.high, mode: "lines", line: { width: 0, color: color }, fill: "tonexty", fillcolor: color.replace("rgb", "rgba").replace(")", ", 0.3)"), hoverinfo: "skip", showlegend: false },
    { x: TEMPERATURE, y: env.mean, mode: "lines", line: { width: 4, color: color }, name: name, hovertemplate: "%{y:.3f}<extra>" + name + "</extra>" },
  ];
}

function singleCurve(yhat, lambda3, color) {
  const name = "ŷ = " + yhat.toFixed(2) + ", λ₃ = " + lambda3.toFixed(3);
  return { x: TEMPERATURE, y: TEMPERATURE.map(y => Math.exp(-logDamage(y, yhat, lambda3))), mode: "lines", line: { width: 2.5, color: color, dash: "dash" }, name: name, hovertemplate: "%{y:.3f}<extra>" + name + "</extra>" };
}

const jumpLine = (x, color) => ({ type: "line", x0: x, x1: x, y0: 0.5, y1: 1, line: { color: color, width: 3, dash: "dot" } });

const SLIDER_STYLE = {
  y: -0.2, yanchor: "top", pad: { t: 10, b: 0, l: 0, r: 0 },
  bgcolor: "#e3eaef", activebgcolor: "#2c6e8f", bordercolor: "#e3eaef", borderwidth: 0,
  tickcolor: "#b7c4cc", ticklen: 5, minorticklen: 3, transition: { duration: 0 },
};
const CURRENT_VALUE = { xanchor: "left", offset: 12, font: { size: 15, color: "#1f3b4d" } };

function draw() {
  const yhat = YHAT_VALUES[state.yhatIndex];
  const lambda3 = LAMBDA_3[state.lambda3Index];
  const data = [];
  for (const c of FIXED_CASES) {
    data.push(...rangeAndAverage(c.yhat, c.color));
  }
  data.push(...rangeAndAverage(yhat, SLIDER_COLOR));
  data.push(singleCurve(yhat, lambda3, SLIDER_COLOR));

  const layout = {
    margin: { l: 70, r: 30, t: 20, b: 170 },
    font: { color: "#1f3b4d" },
    paper_bgcolor: "#ffffff",
    plot_bgcolor: "#ffffff",
    hovermode: "x",
    legend: { x: 0.02, y: 0.06, xanchor: "left", yanchor: "bottom", bgcolor: "rgba(255,255,255,0.85)", font: { size: 13 } },
    xaxis: { title: { text: "temperature anomaly (°C)" }, range: [0, 3.5], dtick: 0.5, showline: true, mirror: true, linecolor: "#444444", ticks: "outside", gridcolor: "#eeeeee", zeroline: false },
    yaxis: { title: { text: "remaining fraction of consumption" }, range: [0.5, 1.0], dtick: 0.1, showline: true, mirror: true, linecolor: "#444444", ticks: "outside", gridcolor: "#eeeeee", zeroline: false },
    shapes: FIXED_CASES.map(c => jumpLine(c.yhat, c.color)).concat([jumpLine(yhat, SLIDER_COLOR)]),
    sliders: [
      Object.assign({}, SLIDER_STYLE, {
        active: state.yhatIndex, x: 0, len: 0.4,
        font: { size: 12, color: "#6b7f8c" },
        currentvalue: Object.assign({ prefix: "ŷ = " }, CURRENT_VALUE),
        steps: YHAT_VALUES.map(v => ({ label: v.toFixed(2), method: "skip", args: [] })),
      }),
      Object.assign({}, SLIDER_STYLE, {
        active: state.lambda3Index, x: 0.48, len: 0.52,
        font: { size: 12, color: "#6b7f8c" },
        currentvalue: Object.assign({ prefix: "λ₃ = " }, CURRENT_VALUE),
        steps: LAMBDA_3.map(v => ({ label: v.toFixed(3), method: "skip", args: [] })),
      }),
    ],
  };
  return Plotly.react("plot", data, layout, { responsive: true, displaylogo: false });
}

draw().then(gd => {
  gd.on("plotly_sliderchange", event => {
    if (event.slider._index === 0) {
      state.yhatIndex = event.slider.active;
    } else {
      state.lambda3Index = event.slider.active;
    }
    draw();
  });
});
</script>
</body>
</html>
